      - {value: true, icon: "yes", label: {en: "Yes", hi: "हाँ"}}
      - {value: false, icon: "no", label: {en: "No", hi: "नहीं"}}

- id: past.surgeries_detail
  slot: past.surgeries_detail
  section: past
  mode: core
  priority: 103
  required: false
  cost_s: 12
  skippable: true
  voice_preferred: true
  ask_if:
    all:
      - {slot: past.surgeries, eq: true}
  prompt:
    en: "What operation was it, and roughly when?"
