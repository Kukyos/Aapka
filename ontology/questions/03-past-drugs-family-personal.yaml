  answer:
    type: single_choice
    options:
      - {value: never, icon: "no", label: {en: "Never", hi: "कभी नहीं"}}
      - {value: within_year, icon: time-recent, label: {en: "Within the last year", hi: "पिछले एक साल में"}}
      - {value: one_to_five_years, icon: time-mid, label: {en: "One to five years ago", hi: "एक से पाँच साल पहले"}}
      - {value: over_five_years, icon: time-old, label: {en: "More than five years ago", hi: "पाँच साल से ज़्यादा पहले"}}
      - {value: unsure, icon: unsure, label: {en: "I do not remember", hi: "याद नहीं"}, synonyms: ["pata nahi", "malum nahi", "yaad nahi", "kya pata"]}

# ------------------------------------------------------------------ drugs & allergy
- id: drugs.taking_now
  slot: drugs.taking_now
  section: drugs
  mode: core
  priority: 32
  required: true
  cost_s: 7
  prompt:
    en: "Are you taking any medicine at the moment?"
    hi: "क्या आप अभी कोई दवा ले रहे हैं?"
  help:
    en: "Any medicine at all — from a doctor, from a shop, or something you take at home."
    hi: "कोई भी दवा — डॉक्टर की दी हुई, दुकान से ली हुई, या घर पर ली जाने वाली।"
  answer:
    type: boolean
    options:
      - {value: true, icon: "yes", label: {en: "Yes", hi: "हाँ"}}
      - {value: false, icon: "no", label: {en: "No", hi: "नहीं"}}

- id: drugs.systems
  slot: drugs.systems
  section: drugs
  mode: core
  priority: 100
  required: false
  cost_s: 11
  ask_if:
    all:
      - {slot: drugs.taking_now, eq: true}
  # Asking which system of medicine is the kind of question an AYUSH OPD needs and a
  # generic intake form never has. A patient on both allopathic and ayurvedic
  # medicine is the common case here, not the exception.
  prompt:
    en: "What kind of medicine is it?"
    hi: "किस तरह की दवा है?"
  answer:
    type: multi_choice
    exclusive_value: none
    options:
      - {value: allopathic, icon: med-allopathic, label: {en: "English medicine", hi: "अंग्रेज़ी दवा"}}
      - {value: ayurvedic, icon: med-ayurvedic, label: {en: "Ayurvedic", hi: "आयुर्वेदिक"}}
      - {value: homeopathic, icon: med-homeopathic, label: {en: "Homeopathic", hi: "होम्योपैथिक"}}
      - {value: siddha, icon: med-siddha, label: {en: "Siddha", hi: "सिद्ध"}}
      - {value: unani, icon: med-unani, label: {en: "Unani", hi: "यूनानी"}}
      - {value: self_medication, icon: med-self, label: {en: "Something I take on my own", hi: "अपने आप ली जाने वाली"}}
      - {value: none, icon: none, label: {en: "None", hi: "कोई नहीं"}, synonyms: ["kuch nahi", "koi nahi", "kuch bhi nahi", "in mein se koi nahi"]}

- id: drugs.adherence
  slot: drugs.adherence
  section: drugs
  mode: core
  priority: 101
  required: false
  cost_s: 8
  ask_if:
    all:
      - {slot: drugs.taking_now, eq: true}
  prompt:
    en: "Are you taking it regularly?"
    hi: "क्या आप दवा नियमित रूप से ले रहे हैं?"
  answer:
    type: single_choice
    options:
      - {value: regular, icon: adhere-good, label: {en: "Yes, every day", hi: "हाँ, रोज़"}}
      - {value: sometimes_missed, icon: adhere-partial, label: {en: "I miss it sometimes", hi: "कभी-कभी छूट जाती है"}}
      - {value: stopped, icon: adhere-stopped, label: {en: "I stopped taking it", hi: "मैंने लेना बंद कर दिया"}}
      - {value: unsure, icon: unsure, label: {en: "I am not sure", hi: "पता नहीं"}, synonyms: ["pata nahi", "malum nahi", "yaad nahi", "kya pata"]}

- id: drugs.allergy_known
  slot: drugs.allergy_known
  section: drugs
  mode: core
  priority: 30
  required: true
  cost_s: 9
  # Required, always. A missed drug allergy is the one intake omission that can
  # directly harm a patient in the room, so it is never displaced by the budget.
  prompt:
    en: "Has any medicine or food ever given you a reaction?"
    hi: "क्या किसी दवा या खाने से आपको कभी कोई प्रतिक्रिया हुई है?"
  help:
    en: "Like a rash, swelling, or trouble breathing after taking something."
    hi: "जैसे कुछ लेने के बाद चकत्ते, सूजन, या साँस लेने में तकलीफ़।"
  answer:
    type: single_choice
    options:
      - {value: none, icon: "no", label: {en: "No, never", hi: "नहीं, कभी नहीं"}, synonyms: ["kuch nahi", "koi nahi", "kuch bhi nahi", "in mein se koi nahi"]}
      - {value: drug_allergy, icon: allergy-drug, label: {en: "Yes, from a medicine", hi: "हाँ, दवा से"}}
      - {value: food_allergy, icon: allergy-food, label: {en: "Yes, from a food", hi: "हाँ, खाने से"}}
      - {value: both, icon: allergy-both, label: {en: "Yes, from both", hi: "हाँ, दोनों से"}}
      - {value: unsure, icon: unsure, label: {en: "I do not know", hi: "पता नहीं"}, synonyms: ["pata nahi", "malum nahi", "yaad nahi", "kya pata"]}

- id: drugs.allergy_detail
  slot: drugs.allergy_detail
  section: drugs
  mode: core
  priority: 31
  required: true
  cost_s: 12
  voice_preferred: true
  ask_if:
    any:
      - {slot: drugs.allergy_known, eq: drug_allergy}
      - {slot: drugs.allergy_known, eq: food_allergy}
      - {slot: drugs.allergy_known, eq: both}
  prompt:
    en: "What was it, and what happened?"
    hi: "वह क्या था, और क्या हुआ था?"
  answer:
    type: text

