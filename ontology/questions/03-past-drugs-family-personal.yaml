# Past history, drugs and allergy, family, personal.
#
# These are the sections a rushed consultation drops first, which is exactly why a
# kiosk should carry them. Kept to single taps — no free text except where a doctor
# genuinely cannot act without the words (allergy detail, surgery detail).

# ------------------------------------------------------------------ past
- id: past.conditions
  slot: past.conditions
  section: past
  mode: core
  # Asked just BEFORE the danger-sign screen. Several red-flag rules read comorbidity
  # to decide whether a symptom is new or the patient's known baseline, and a rule
  # cannot do that if it fires before we have asked.
  priority: 23
  required: true
  cost_s: 15
  # Required: comorbidities change the reading of every other answer, and several
  # red-flag rules are conditioned on them.
  prompt:
    en: "Has a doctor ever told you that you have any of these?"
    hi: "क्या डॉक्टर ने कभी बताया है कि आपको इनमें से कुछ है?"
  help:
    en: "Choose as many as apply. If none, choose None of these."
    hi: "जितने लागू हों उतने चुनिए। कोई न हो तो 'इनमें से कोई नहीं' चुनिए।"
  answer:
    type: multi_choice
    exclusive_value: none
    options:
      - {value: diabetes, icon: cond-diabetes, label: {en: "Diabetes (sugar)", hi: "मधुमेह (शुगर)"}, synonyms: ["sugar", "shugar", "madhumeh", "sugar ki bimari"]}
      - {value: hypertension, icon: cond-bp, label: {en: "High blood pressure", hi: "उच्च रक्तचाप (बी.पी.)"}, synonyms: ["bp", "bee pee", "blood pressure", "high bp", "rakt chap"]}
      - {value: heart_disease, icon: cond-heart, label: {en: "Heart disease", hi: "दिल की बीमारी"}, synonyms: ["dil ki bimari", "hriday rog", "heart ki problem"]}
      - {value: asthma, icon: cond-asthma, label: {en: "Asthma", hi: "दमा"}, synonyms: ["dama", "damma", "saans ki bimari"]}
      - {value: tuberculosis, icon: cond-tb, label: {en: "Tuberculosis (TB)", hi: "टी.बी."}, synonyms: ["tb", "ti bi", "kshay rog"]}
      - {value: thyroid, icon: cond-thyroid, label: {en: "Thyroid problem", hi: "थायरॉइड"}, synonyms: ["thyroid", "gale ki gilti"]}
      - {value: kidney_disease, icon: cond-kidney, label: {en: "Kidney disease", hi: "गुर्दे की बीमारी"}}
      - {value: liver_disease, icon: cond-liver, label: {en: "Liver disease", hi: "जिगर की बीमारी"}}
      - {value: stroke, icon: cond-stroke, label: {en: "Paralysis or stroke", hi: "लकवा"}, synonyms: ["lakwa", "lakva", "paralysis", "falij"]}
      - {value: cancer, icon: cond-cancer, label: {en: "Cancer", hi: "कैंसर"}, synonyms: ["cancer", "kainsar", "arbud"]}
      - {value: epilepsy, icon: cond-epilepsy, label: {en: "Fits", hi: "मिर्गी"}, synonyms: ["mirgi", "daure aate hain"]}
      - {value: arthritis, icon: cond-arthritis, label: {en: "Arthritis", hi: "गठिया"}, synonyms: ["gathiya", "gathia", "jodon ka dard"]}
      - {value: none, icon: none, label: {en: "None of these", hi: "इनमें से कोई नहीं"}, synonyms: ["kuch nahi", "koi nahi", "kuch bhi nahi", "in mein se koi nahi"]}
      - {value: unsure, icon: unsure, label: {en: "I do not know", hi: "पता नहीं"}, synonyms: ["pata nahi", "malum nahi", "yaad nahi", "kya pata"]}

- id: past.surgeries
  slot: past.surgeries
  section: past
