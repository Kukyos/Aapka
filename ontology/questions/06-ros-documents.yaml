# ------------------------------------------------------------------ documents
# Last, and required. The document step is a separate screen in the kiosk flow, but
# the decision to enter it is a graph node like any other, so an interview that runs
# out of budget still reaches it.
- id: docs.has_papers
  slot: docs.has_papers
  section: docs
  mode: core
  priority: 200
  required: true
  cost_s: 8
  prompt:
    en: "Do you have any old prescriptions, test reports or hospital papers with you?"
    hi: "क्या आपके पास कोई पुराना पर्चा, जाँच रिपोर्ट या अस्पताल के काग़ज़ हैं?"
  help:
    en: "If you do, you can hold them up to the camera in a moment. Crumpled and handwritten is fine."
    hi: "अगर हैं, तो आप उन्हें अभी कैमरे के सामने दिखा सकते हैं। मुड़े हुए और हाथ से लिखे काग़ज़ भी चलेंगे।"
  answer:
    type: boolean
    options:
      - {value: true, icon: doc-papers, label: {en: "Yes, I have papers", hi: "हाँ, मेरे पास काग़ज़ हैं"}}
      - {value: false, icon: "no", label: {en: "No, I do not", hi: "नहीं, मेरे पास नहीं हैं"}}
