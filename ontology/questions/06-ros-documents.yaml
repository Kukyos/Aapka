# Review of systems, then documents.
#
# ROS sits at priority 130+, BEHIND the AYUSH block. That ordering is decision D3
# expressed as data: when the four-minute budget runs out, the general sweep is what
# gets displaced, not the Dashavidha assessment. Change these numbers and you have
# changed the product's position, so change them deliberately.
#
# Each ROS node also skips the body region the chief complaint already covered in
# detail — asking "any chest pain?" of someone who came in with chest pain wastes
# eight seconds and makes the machine look like it was not listening.

- id: ros.danger_signs
  slot: ros.danger_signs
  section: ros
  mode: core
  priority: 25
  required: true
  cost_s: 16
  # Required and asked early, right after the SOCRATES core. This is the node the
  # red-flag rules depend on — see the slot comment in slots.yaml. It is never
  # displaced by the budget, in any mode, for any complaint.
  prompt:
    en: "Have you had any of these, even once?"
    hi: "क्या आपको इनमें से कुछ हुआ है, एक बार भी?"
  help:
    en: "These are things we need to know about straight away. Choose any that apply, or None of these."
    hi: "ये बातें हमें तुरंत जाननी होती हैं। जो लागू हों वे चुनिए, या 'इनमें से कोई नहीं' चुनिए।"
  answer:
    type: multi_choice
    exclusive_value: none
    options:
      - {value: weakness_limb, icon: ros-limb-weakness, label: {en: "Sudden weakness in an arm or leg", hi: "हाथ या पैर में अचानक कमज़ोरी"}, synonyms: ["haath pair kaam nahi", "lakwa", "hath sun", "pair sun"]}
      - {value: vision_change, icon: ros-vision, label: {en: "Sudden change in eyesight", hi: "नज़र में अचानक बदलाव"}}
      - {value: fits, icon: cond-epilepsy, label: {en: "Fits", hi: "दौरे"}, synonyms: ["daure", "daura", "mirgi", "jhatke"]}
      - {value: fainting, icon: ros-fainting, label: {en: "Fainting", hi: "बेहोशी"}, synonyms: ["behosh", "behoshi", "gir gaya", "chakkar aakar gira"]}
      - {value: blood_in_sputum, icon: ros-blood-sputum, label: {en: "Blood when coughing", hi: "खाँसी में ख़ून"}, synonyms: ["khansi mein khoon", "balgam mein khoon", "khoon ki khansi"]}
      - {value: blood_in_stool, icon: ros-blood-stool, label: {en: "Blood in stool", hi: "शौच में ख़ून"}, synonyms: ["shauch mein khoon", "tatti mein khoon", "khoon aa raha"]}
      - {value: black_stool, icon: ros-black-stool, label: {en: "Black stool", hi: "काला शौच"}, synonyms: ["kala shauch", "kali tatti", "kala motion"]}
      - {value: blood_in_urine, icon: uro-blood, label: {en: "Blood in urine", hi: "पेशाब में ख़ून"}, synonyms: ["peshab mein khoon", "laal peshab"]}
      - {value: retention, icon: uro-retention, label: {en: "Not able to pass urine", hi: "पेशाब न आना"}, synonyms: ["peshab nahi aa raha", "peshab ruk gaya"]}
      - {value: jaundice, icon: cond-liver, label: {en: "Yellow eyes or skin", hi: "आँखों या त्वचा का पीलापन"}, synonyms: ["piliya", "peelia", "aankh peeli", "peela pan"]}
      - {value: none, icon: none, label: {en: "None of these", hi: "इनमें से कोई नहीं"}, synonyms: ["kuch nahi", "koi nahi", "kuch bhi nahi", "in mein se koi nahi"]}

