  answer:
    type: multi_choice
    exclusive_value: none
    options:
      - {value: weight_loss, icon: assoc-weight-loss, label: {en: "Losing weight without trying", hi: "बिना कोशिश के वज़न घटना"}, synonyms: ["wajan kam", "vajan ghat", "dubla ho raha"]}
      - {value: weight_gain, icon: ros-weight-gain, label: {en: "Gaining weight", hi: "वज़न बढ़ना"}}
