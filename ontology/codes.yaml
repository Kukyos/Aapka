# ---------------------------------------------------------------------------------
# Dosha findings.
#
# These DO carry TM2 codes, and the difference from the complaints above is the whole
# argument. SR10, SR15 and SR1A are *pattern* codes for the vitiation of a dosha, and
# they attach to what the patient said about their own present imbalance in the Vikriti
# question - emitted as patient-reported and marked `unconfirmed` in the FHIR bundle,
# for the physician to confirm, amend or reject.
#
# A pattern the patient reported, marked unconfirmed, is a structured history.
# A disorder the kiosk chose would be a diagnosis. Only the first is ours to write.
#
# Also in TM2 and deliberately unused: the "Body constitution and temperament patterns"
# block, ST00 to ST1Z. Those are Unani mizaj - hot, cold, moist and dry temperaments -
# and they are not Ayurvedic Prakriti. Our abbreviated Prakriti screen carries no TM2
# code at all, because TM2 codes derangements and Prakriti is a normal constitution
# rather than a derangement. There is nothing there to point at.
# ---------------------------------------------------------------------------------

dosha_findings:
  vata:
    icd11_tm2:
      code: SR10
      term: "Vitiation of vāta pattern (TM2)"
      provenance: sourced
      source: "WHO ICD-11 API, MMS 2025-01, Chapter 26 Module II"
  pitta:
    icd11_tm2:
      code: SR15
      term: "Vitiation of pitta pattern (TM2)"
      provenance: sourced
      source: "WHO ICD-11 API, MMS 2025-01, Chapter 26 Module II"
  kapha:
