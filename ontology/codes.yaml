# Terminology codes emitted on the output side.
#
# Decision D2 in 06-decisions.md: we hand-build the question graph, but the structured
# output carries NAMASTE + ICD-11 codes. Dual coding is the part a judge from the
# Ministry can actually check, and India has a live roadmap to dual-code NAMASTE
# against ICD-11 TM2.
#
# ---------------------------------------------------------------------------------
# STATUS, 2026-09-04. Three code systems, three different answers.
#
#   ICD-11 MMS   SOURCED. Pulled from the WHO ICD-11 API, release 2025-01, against
#                credentials obtained on 2026-09-04. Every code below was returned by
#                the API for the term recorded beside it, and is checkable at
#                https://icd.who.int/browse/2025-01/mms/en
#
#   ICD-11 TM2   SOURCED for dosha findings. Module II of Chapter 26 - Ayurveda,
#                Siddha and Unani - reached through the same API and cached at
#                ontology/cache/icd11-tm2-2025-01.json (710 entities, 648 coded).
#                Re-pull with `python -m tools.fetch_icd11`.
#
#                NOT ASSIGNED for chief complaints, and that is a refusal rather than
#                a gap. See the note above `complaints`.
#
#   NAMASTE      Still unsourced. namaste.ayush.gov.in publishes the portal, not the
#                code list; an account is needed. Tracked as D-04.
#
# The trap we avoided, recorded because it is easy to fall into: the freely
# downloadable Chapter 26 PDF is Module I - TM1, East Asian medicine. Its codes are
# real and they are the wrong ones. An Ayurveda intake carrying a TCM pattern code
# would be a factual error dressed up as diligence. TM2 is API-only.
#
# Every consumer of this file - summary.py, fhir.py, the doctor screen - checks
# `provenance` and renders anything not `sourced` as pending, never as fact.
# `test_codes_file_invariant_holds` in server/tests/test_core.py enforces that a
# `sourced` entry has a code and that a coded entry is marked `sourced`.
# ---------------------------------------------------------------------------------

version: 2

provenance_levels:
  sourced: "Verified against a published, citable source. Safe to display as a code."
  PLACEHOLDER: "Structure only. No source obtained. Rendered as pending everywhere."
  not_coded: >-
    Deliberately left uncoded. The source exists and was read; assigning a code from it
    would assert something this system is not allowed to assert. Distinct from
    PLACEHOLDER, which means the source could not be obtained at all.

# ---------------------------------------------------------------------------------
# Chief complaints.
#
# `icd11_mms` carries a SYMPTOM code, never a disease code - MD12 Cough, MG22 Fatigue,
# ME82 Pain in joint. That is the correct register: the patient reported a symptom and
# no one has examined them yet. Where the API surfaced a disease sharing the word
# (8A8Z Headache disorders, CA23 Asthma, BA40 Angina pectoris) it was rejected.
#
# `icd11_tm2` is empty on every complaint, marked `not_coded`.
#
#   TM2 codes disorders and patterns: "Cough disorder (TM2)", "Severe fatigue disorder
#   (TM2)", "Enteric fever disorder (TM2)". Attaching one of those to a patient who
#   said "I have a cough" would be a traditional-medicine diagnosis made by a kiosk.
#   Hard rule 1 forbids it and gate G3 says the physician is the authority.
#
#   The codes exist and we hold all 648 of them in the cache. They are the physician's
#   to apply after examination, not ours to guess before it. This is the one place in
#   the system where having the data and declining to use it is the correct answer.
# ---------------------------------------------------------------------------------

