# Terminology codes emitted on the output side.
#
# Decision D2 in 06-decisions.md: we hand-build the question graph, but the structured
# output carries NAMASTE + ICD-11 codes. Dual coding is the part a judge from the
# Ministry can actually check, and India has a live roadmap to dual-code NAMASTE
# against ICD-11 TM2.
#
# ---------------------------------------------------------------------------------
# EVERY CODE BELOW IS A PLACEHOLDER. NONE OF THEM IS REAL.
#
# This is deliberate, and it is the honest position. Three separate attempts to source
# real codes on 2026-09-02 all failed for the same reason — the code lists are not
# publicly downloadable:
#
#   NAMASTE (NAMC)   namaste.ayush.gov.in publishes the portal, not the code list.
#                    Published figure: 7,340 Ayush morbidity codes. Requires an account.
#
#   ICD-11 TM2       Module 2 (Ayurveda, Siddha, Unani) was added in 2025. The freely
#                    downloadable Chapter 26 PDF is Module 1 — East Asian medicine.
#                    Its codes (SA00 Hypochondrium pain disorder, SA01 Jaundice
#                    disorder, and so on) are real, but they are TCM patterns. Using
#                    them for an Ayurveda intake would be a factual error, not a
#                    shortcut, so they are not used here.
#
#   ICD-11 MMS       The WHO browser is JavaScript-rendered and the API needs OAuth
#                    client credentials (free, application-based, not yet obtained).
#
# The alternative to placeholders was to write down codes that look plausible. For a
# submission judged by the ministry that owns the NAMASTE portal, a fabricated code is
# strictly worse than an empty one. Every consumer of this file — summary.py, fhir.py,
# the doctor screen — checks `provenance` and renders unsourced codes as pending,
# never as fact.
#
# Tracked as docs/11-deferred.md D-04 and D-05.
# ---------------------------------------------------------------------------------

version: 1

provenance_levels:
  sourced: "Verified against a published, citable source. Safe to display as a code."
  PLACEHOLDER: "Structure only. Never displayed as a code; rendered as 'pending' everywhere."

# How to close this out, so whoever gets portal access knows exactly what to fill in:
#   1. Log in to namaste.ayush.gov.in, export the NAMC list for Ayurveda.
#   2. Apply for ICD-11 API credentials at icd.who.int/icdapi (free).
#   3. For each complaint below, fill `namaste.code`, `icd11_tm2.code` and
#      `icd11_mms.code`, and change `provenance` to `sourced` with the export date.
#   4. Run `python -m pytest server/tests/test_codes.py` — it asserts that anything
#      marked `sourced` actually has a non-empty code, and vice versa.

complaints:

